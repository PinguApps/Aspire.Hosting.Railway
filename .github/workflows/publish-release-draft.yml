name: Publish Release Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '32 9 * * 0' # Sunday 09:32 UTC

permissions:
  contents: write

concurrency:
  group: publish-release-draft
  cancel-in-progress: false

jobs:
  publish_draft:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.publish.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Publish draft if main has new commits
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate | jq -s 'add')
          latest_tag=$(jq -r '[.[] | select(.draft == false)] | max_by(.published_at) | .tag_name // empty' <<< "$releases")
          if [[ -z "$latest_tag" ]]; then
            echo "No published release to compare against"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$latest_tag" HEAD; then
            echo "Latest release tag $latest_tag is not on main" >&2
            exit 1
          fi

          if [[ $(git rev-list --count "$latest_tag..HEAD") -eq 0 ]]; then
            echo "No commits on main since $latest_tag"
            exit 0
          fi

          draft_count=$(jq -r '[.[] | select(.draft)] | length' <<< "$releases")
          if [[ "$draft_count" -gt 1 ]]; then
            echo "Multiple release drafts exist; refusing to choose one" >&2
            exit 1
          fi

          draft=$(jq -r '[.[] | select(.draft)] | if length == 0 then empty else .[0] | [.id, .tag_name] | @tsv end' <<< "$releases")
          if [[ -z "$draft" ]]; then
            echo "No release draft available"
            exit 0
          fi

          IFS=$'\t' read -r draft_id draft_tag <<< "$draft"
          if [[ ! "$draft_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$draft_tag" == "$latest_tag" ]] ||
             [[ $(printf '%s\n' "$latest_tag" "$draft_tag" | sort -V | tail -n 1) != "$draft_tag" ]]; then
            echo "Draft tag $draft_tag is not newer than $latest_tag" >&2
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false --jq .html_url
          echo "tag=$draft_tag" >> "$GITHUB_OUTPUT"

  publish_packages:
    needs: publish_draft
    if: needs.publish_draft.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.publish_draft.outputs.tag }}
    secrets: inherit
