name: Auto Labeller

on:
  pull_request_target:
    types:
      - opened
      - edited

jobs:
  labelling:
    name: Labelling
    # Necessary fragments of the pinned action's pattern. Unchecked labels can remove labels.
    if: >-
      contains(github.event.pull_request.body, '- [') &&
      (contains(github.event.pull_request.body, '] `') || contains(github.event.pull_request.body, ']`'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: harupy/auto-labeling@937d558e37285af6ca5c5813a826cf6f0d66bf0f # master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-pattern: '- \[(.*?)\] ?`(.+?)`' # matches '- [x] `label`'
